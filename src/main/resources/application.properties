# --- Database (Change to your cloud MySQL DB) ---
spring.datasource.url=jdbc:mysql://YOUR_DB_HOST:3306/YOUR_DB_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_DB_USER
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Port ---
server.port=${PORT:8080}   # IMPORTANT for Render

# --- Static (only if React build inside backend) ---
spring.web.resources.static-locations=classpath:/static/,classpath:/build/,classpath:/build/static/
spring.mvc.static-path-pattern=/**
